<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Đăng nhập - Phần mềm soát lỗi TAF AMO Đà Nẵng</title>
<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #062547 0%, #0d47a1 55%, #1976d2 100%); color: #102a43; display: flex; align-items: center; justify-content: center; padding: 20px; }
.login-card { width: 100%; max-width: 420px; background: #ffffff; border-radius: 14px; box-shadow: 0 18px 50px rgba(0,0,0,0.35); overflow: hidden; border-top: 5px solid #ffb300; }
.login-head { background: linear-gradient(90deg, #0b3c6f, #1565c0, #0b3c6f); color: #ffeb3b; text-align: center; padding: 22px 20px 18px; }
.login-head h1 { margin: 0 0 6px; font-size: 19px; letter-spacing: 0.8px; text-transform: uppercase; font-weight: 800; }
.login-head p { margin: 0; color: #e3f2fd; font-size: 12.5px; }
form { padding: 24px 26px 26px; }
label { display: block; font-size: 12.5px; font-weight: 700; color: #475569; margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.4px; }
.field { margin-bottom: 16px; position: relative; }
input[type=text], input[type=password] { width: 100%; padding: 11px 12px; border: 1.5px solid #94a3b8; border-radius: 8px; font-size: 15px; background: #f8fafc; color: #0f172a; }
input:focus { outline: none; border-color: #1565c0; background: #fff; box-shadow: 0 0 0 3px rgba(21,101,192,0.16); }
.toggle { position: absolute; right: 8px; top: 29px; background: none; border: none; color: #1565c0; font-size: 12px; font-weight: 700; cursor: pointer; padding: 4px 6px; }
button.submit { width: 100%; padding: 12px; border: 2px solid #082e6b; border-radius: 8px; background: linear-gradient(135deg, #0d47a1, #1976d2); color: #fff; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; }
button.submit:hover { filter: brightness(1.08); }
button.submit:disabled { opacity: 0.6; cursor: wait; }
.msg { min-height: 20px; margin: 0 0 12px; font-size: 13px; font-weight: 600; text-align: center; color: #c62828; }
.foot { text-align: center; font-size: 11.5px; color: #64748b; padding: 0 20px 18px; line-height: 1.5; }
#appFrame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #eef3f8; display: none; }
#logoutBtn { position: fixed; right: 12px; bottom: 12px; z-index: 10; display: none; background: rgba(6,37,71,0.92); color: #fff; border: 1px solid #ffb300; border-radius: 20px; padding: 7px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.3); }
#logoutBtn:hover { background: #0d47a1; }
</style>
</head>
<body>
<div class="login-card" id="loginCard">
  <div class="login-head">
    <h1>Phần mềm soát lỗi bản tin TAF</h1>
    <p>Trung tâm Khí tượng Hàng không Đà Nẵng (AMO Đà Nẵng)</p>
  </div>
  <form id="loginForm" autocomplete="on">
    <div class="field">
      <label for="u">Tên đăng nhập</label>
      <input type="text" id="u" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required autofocus>
    </div>
    <div class="field">
      <label for="p">Mật khẩu</label>
      <input type="password" id="p" name="password" autocomplete="current-password" required>
      <button type="button" class="toggle" id="togglePw" tabindex="-1">Hiện</button>
    </div>
    <div class="msg" id="msg" role="alert"></div>
    <button type="submit" class="submit" id="btn">Đăng nhập</button>
  </form>
  <div class="foot">Chỉ dành cho cán bộ được cấp tài khoản.<br>Copyright: Nguyễn Đức Dũng</div>
</div>
<button type="button" id="logoutBtn">Đăng xuất</button>

const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = u8 => { let s = ''; u8.forEach(b => s += String.fromCharCode(b)); return btoa(s); };
const SKEY = 'amo_taf_session_key';
let fails = 0, lockUntil = 0;

async function deriveKey(user, pass) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(user.trim().toLowerCase() + '\u0000' + pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function decryptApp(key) {
  const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct));
  return new TextDecoder().decode(buf);
}
function showApp(html) {
  $('loginCard').style.display = 'none';
  document.body.style.background = '#eef3f8';
  const f = $('appFrame');
  f.srcdoc = html;
  f.style.display = 'block';
  $('logoutBtn').style.display = 'block';
}
async function tryLogin(user, pass) {
  const key = await deriveKey(user, pass);
  const html = await decryptApp(key);            // sai tài khoản -> ném lỗi
  try { sessionStorage.setItem(SKEY, toB64(new Uint8Array(await crypto.subtle.exportKey('raw', key)))); } catch (e) {}
  showApp(html);
}
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = $('msg'), btn = $('btn');
  if (!window.crypto || !crypto.subtle) { msg.textContent = 'Trình duyệt không hỗ trợ mã hóa. Hãy mở bằng Chrome/Edge bản mới qua địa chỉ https://.'; return; }
  const wait = Math.ceil((lockUntil - Date.now()) / 1000);
  if (wait > 0) { msg.textContent = 'Nhập sai nhiều lần. Vui lòng thử lại sau ' + wait + ' giây.'; return; }
  btn.disabled = true; msg.style.color = '#475569'; msg.textContent = 'Đang xác thực...';
  try {
    await tryLogin($('u').value, $('p').value);
  } catch (err) {
    fails++;
    if (fails >= 5) { lockUntil = Date.now() + 30000; fails = 0; }
    msg.style.color = '#c62828';
    msg.textContent = 'Sai tên đăng nhập hoặc mật khẩu.';
    $('p').value = ''; $('p').focus();
  } finally { btn.disabled = false; }
});
$('togglePw').addEventListener('click', () => {
  const p = $('p'), show = p.type === 'password';
  p.type = show ? 'text' : 'password';
  $('togglePw').textContent = show ? 'Ẩn' : 'Hiện';
});
$('logoutBtn').addEventListener('click', () => { try { sessionStorage.removeItem(SKEY); } catch (e) {} location.reload(); });
// Giữ phiên đăng nhập trong thẻ trình duyệt hiện tại (đóng thẻ là phải đăng nhập lại)
(async () => {
  try {
    const raw = sessionStorage.getItem(SKEY);
    if (!raw || !window.crypto || !crypto.subtle) return;
    const key = await crypto.subtle.importKey('raw', b64(raw), { name: 'AES-GCM' }, false, ['decrypt']);
    showApp(await decryptApp(key));
  } catch (e) { try { sessionStorage.removeItem(SKEY); } catch (e2) {} }
})();
</script>
